<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <clipPath id="c">
      <circle cx="13" cy="13" r="8"/>
    </clipPath>
  </defs>
  <!-- Rounded-square background -->
  <rect width="32" height="32" rx="7" fill="url(#g)"/>
  <!-- Equalizer bars clipped to lens circle -->
  <g clip-path="url(#c)">
    <rect x="7"  y="15" width="3" height="6"  rx="1" fill="white"/>
    <rect x="11" y="12" width="3" height="9"  rx="1" fill="white"/>
    <rect x="15" y="9"  width="3" height="12" rx="1" fill="white"/>
  </g>
  <!-- Lens ring -->
  <circle cx="13" cy="13" r="8" fill="none" stroke="white" stroke-width="2.5"/>
  <!-- Handle -->
  <line x1="19.5" y1="19.5" x2="26" y2="26" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
</svg>
