# Host nginx site for suno-analysis.hafizhrafizal.com
# Installed to /etc/nginx/sites-available/suno-analysis and symlinked into sites-enabled.
# TLS certificate is issued/renewed by certbot (webroot at /var/www/certbot).

server {
    listen 80;
    listen [::]:80;
    server_name suno-analysis.hafizhrafizal.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;        # nginx 1.24: http2 is a listen flag
    listen [::]:443 ssl http2;
    server_name suno-analysis.hafizhrafizal.com;

    ssl_certificate     /etc/letsencrypt/live/suno-analysis.hafizhrafizal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/suno-analysis.hafizhrafizal.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Large Discord CSV exports are uploaded through /api/upload
    client_max_body_size 200m;

    gzip       on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Rust backend (docker, bound to localhost). Keep the /api/ prefix intact.
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;   # long-running analyses (topics, batch sentiment)
        proxy_send_timeout 600s;

        # Required for SSE / streaming responses
        proxy_buffering off;
        proxy_cache     off;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8000;
    }

    # React SPA (deployed by CI)
    root  /var/www/suno-analysis;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
