# Local development stack: `docker compose up --build`, then open http://localhost
# (run `npm run build` in frontend/ first so nginx has a dist/ to serve).
#
# Qdrant runs natively on the host (not in Docker); the backend reaches it via
# host.docker.internal:6333. Postgres is exposed on 5432 for native tools.
#
# Production uses deploy/docker-compose.prod.yml instead (see deploy/README.md).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: retrieval
      POSTGRES_USER: retrieval
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retrieval"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai_service:
    build:
      context: ./ai_service
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # When set, /analyze_emotion forwards inference to this HF Dedicated
      # Endpoint (using the per-request X-HF-Token as the Bearer auth) instead
      # of running the local ONNX model.  Empty = use local model.
      HF_ENDPOINT_URL: ${HF_ENDPOINT_URL:-https://yk8g5z6jkf0tuyjs.us-east-1.aws.endpoints.huggingface.cloud}
    volumes:
      - ai_model_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 300s   # allow up to 5 min for model loading on first start

  backend:
    build:
      context: .
    image: retrieval-backend:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai_service:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://retrieval:${POSTGRES_PASSWORD}@postgres:5432/retrieval
      VECTOR_DB: qdrant
      QDRANT_URL: http://host.docker.internal:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-discord_openai}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      APP_MODE: ${APP_MODE:-multi}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RUST_LOG: ${RUST_LOG:-info}
      AI_SERVICE_URL: http://ai_service:8001

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro

volumes:
  postgres_data:
  ai_model_cache:   # HuggingFace model weights — persists across rebuilds
